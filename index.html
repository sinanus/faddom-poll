<title>Altyapı Sağlık Testi | Faddom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--fg:#085858;--soft:#EEF6F6;--line:#BFD8D8;--ac:#0E8A8A;--bad:#B4532A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1F1F;--fg:#CFEDED;--soft:#10302F;--line:#1F4A49;--ac:#4FD1C5;--bad:#F0A27A}}
:root[data-theme="dark"]{--bg:#0A1F1F;--fg:#CFEDED;--soft:#10302F;--line:#1F4A49;--ac:#4FD1C5;--bad:#F0A27A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',Arial,sans-serif;line-height:1.4}
.w{max-width:720px;margin:0 auto;padding:24px 20px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.lg{background:#fff;border-radius:10px;padding:6px 10px;display:flex}.lg img{height:28px;display:block}
.pg{font-weight:700;letter-spacing:2px;font-size:14px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 14px}
h2{font-size:clamp(22px,4.5vw,30px);line-height:1.2;margin:0 0 18px}
p{margin:0 0 18px;font-size:18px}
.bar{height:6px;background:var(--soft);border-radius:3px;margin-bottom:26px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin-bottom:14px}
.o{display:block;width:100%;text-align:left;font:inherit;font-size:18px;font-weight:500;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.o:hover,.o:focus-visible{border-color:var(--ac);background:var(--soft);outline:none}
.b{font:inherit;font-weight:700;font-size:18px;background:var(--fg);color:var(--bg);border:0;border-radius:14px;padding:14px 26px;cursor:pointer}
.ring{display:flex;align-items:center;gap:22px;margin-bottom:24px;flex-wrap:wrap}
.ring b{font-size:44px;display:block;line-height:1}
.it{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;background:var(--soft)}
.it strong{display:flex;justify-content:space-between;gap:10px}.it span{font-size:15px;display:block;margin-top:4px}
.gap{color:var(--bad)}
.cta{margin-top:26px;padding:18px;border-radius:16px;border:2px solid var(--fg)}
a{color:var(--ac);font-weight:700}
</style></head><body><div class="w">

<script>
var Q=[
["Haritalama","Kritik uygulamalarınızın hangi sunucu ve servislere bağlı olduğunu güncel bir haritada görebiliyor musunuz?","Faddom, ajan kurmadan uygulama bağımlılıklarını otomatik haritalar."],
["Değişiklik yönetimi","Bir değişiklik yapmadan önce hangi uygulamaları etkileyeceğini biliyor musunuz?","Faddom kayıtlı baseline ile karşılaştırır ve değişikliğin etkisini önceden gösterir."],
["Envanter","Sunucu, işletim sistemi ve yazılım envanteriniz otomatik ve güncel mi?","Faddom envanteri VMware, AWS, Azure, Nutanix gibi kaynaklardan otomatik çıkarır."],
["Kaynak optimizasyonu","Atıl ya da gereğinden fazla tahsis edilmiş CPU ve bellek kaynaklarını tespit ediyor musunuz?","Faddom gerçek kullanıma göre doğru boyutlandırma (rightsizing) önerileri sunar."],
["Anomali tespiti","Olağan dışı ağ trafiğini (yetkisiz erişim, anormal DNS sorgusu vb.) fark edebiliyor musunuz?","Faddom Lighthouse AI normal davranışı öğrenir ve sapmaları yakalar."],
["Shadow IT","Unutulmuş ya da yönetilmeyen sunucuların sayısını biliyor musunuz?","Faddom, 7 gündür düşük trafikli ve değişmeyen sunucuları Shadow IT olarak işaretler."]];
var O=[["Evet, net olarak",2],["Kısmen",1],["Hayır / emin değilim",0]];
var i=-1,A=[],app=document.getElementById("app"),pg=document.getElementById("pg");
function start(){i=0;A=[];show()}
function pick(s){A[i]=s;i++;show()}
function show(){
 if(i<0){pg.textContent="";app.innerHTML='<h1>Altyapınızı ne kadar tanıyorsunuz?</h1><p>6 kısa soru, 1 dakika. Hibrit altyapınızdaki görünürlük seviyenizi ölçün.</p><button class="b" onclick="start()">Teste başla</button>';return}
 if(i>=Q.length){result();return}
 pg.textContent="0"+(i+1)+" / 0"+Q.length;
 var h='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><span class="tag">'+Q[i][0]+'</span><h2>'+Q[i][1]+'</h2>';
 O.forEach(function(o){h+='<button class="o" onclick="pick('+o[1]+')">'+o[0]+'</button>'});
 app.innerHTML=h}
function result(){
 pg.textContent="SONUÇ";
 var t=A.reduce(function(a,b){return a+b},0),max=Q.length*2,L=t<=4?"Görünmez bölge":t<=8?"Yolun ortasında":"İyi yönetilen";
 var M=t<=4?"Altyapınızda ciddi kör noktalar olabilir.":t<=8?"Temel görünürlük var, ama boşluklar kalmış.":"Güçlü bir görünürlüğünüz var. Boşlukları kapatarak ilerleyin.";
 var pct=Math.round(t/max*100),c=2*Math.PI*54,d=c*t/max;
 var h='<div class="ring"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="65" cy="65" r="54" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+d+' '+c+'" transform="rotate(-90 65 65)"/></svg><div><span style="display:block;font-size:15px;font-weight:700;margin-bottom:4px">Görünürlük seviyeniz</span><b>%'+pct+'</b><h2 style="margin:6px 0 4px">'+L+'</h2><span>'+M+'</span></div></div>';
 Q.forEach(function(q,k){var s=A[k],g=s<2;
  h+='<div class="it"><strong><span style="margin:0;font-size:17px">'+q[0]+'</span><span class="'+(g?'gap':'')+'" style="margin:0;font-size:15px">'+(s==2?"Güçlü":s==1?"Geliştirilebilir":"Boşluk")+'</span></strong>'+(g?'<span>'+q[2]+'</span>':'')+'</div>'});
 h+='<div class="cta"><p style="margin-bottom:10px"><b>Boşlukları kapatmak için Faddom\'u deneyin.</b> Ajan kurmadan dakikalar içinde ortamınızın haritasını çıkarır.</p><a href="https://faddom.com" target="_blank" rel="noopener">faddom.com</a> &nbsp;|&nbsp; <a href="https://itss.com.tr" target="_blank" rel="noopener">itss.com.tr</a></div><p style="margin-top:20px"><button class="b" onclick="i=-1;show()">Testi tekrarla</button></p>';
 app.innerHTML=h}
show();
</script></body></html>
